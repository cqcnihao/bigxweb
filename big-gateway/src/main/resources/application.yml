server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:certs/gateway.p12
    key-store-type: PKCS12
    key-store-password: ${SSL_STORE_PWD:bigx-gateway}
    key-alias: gateway

spring:
  application:
    name: big-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        ip: ${NACOS_IP:127.0.0.1}
        prefer-ip-address: true
    gateway:
      # SCG 5.0 起属性前缀从 spring.cloud.gateway 迁移到 spring.cloud.gateway.server.webflux
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: big-auth
              uri: lb://big-auth
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=0
                # 签名必须在 StripPrefix 之后计算，保证签名 URI 与下游收到的一致
                - SignRequest

            # SM2 公钥下发等加密握手端点，由 big-auth 承载（控制器在 big-encrypt 模块）
            - id: big-auth-crypto
              uri: lb://big-auth
              predicates:
                - Path=/crypto/**
              filters:
                - StripPrefix=0
                - SignRequest

            - id: big-business
              uri: lb://big-business
              predicates:
                - Path=/api/**
              filters:
                - StripPrefix=1
                - SignRequest

# 与下游 big-web-common GatewayValidationFilter 共享的 HMAC 密钥，生产环境必须走环境变量
gateway:
  validation:
    secret: ${GATEWAY_VALIDATION_SECRET:dev-gateway-secret-do-not-use-in-prod}

sa-token:
  token-name: Authorization
  # 与 big-auth 保持一致：30 天有效，避免网关侧提前判定 token 失效
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  # 与 big-auth 一致：每次登录新建 token，便于单端踢下线
  is-share: false
  token-style: uuid
  is-log: false

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: WARN

big:
  # 软件许可证（TrueLicense）：默认关闭（开发零感知）；
  # 生产 BIG_LICENSE_ENABLED=true + BIG_LICENSE_STORE_PWD 开启，部署目录需含 ./license/license.lic 与 ./license/publicCerts.store
  license:
    enabled: ${BIG_LICENSE_ENABLED:false}
    subject: ${BIG_LICENSE_SUBJECT:bigx}
    license-path: ${BIG_LICENSE_PATH:./license/license.lic}
    public-certs-path: ${BIG_LICENSE_PUB_STORE:./license/publicCerts.store}
    store-pwd: ${BIG_LICENSE_STORE_PWD:}
    verify-interval-minutes: ${BIG_LICENSE_VERIFY_INTERVAL:30}
    on-fail: ${BIG_LICENSE_ON_FAIL:exit}
    clock-rollback-check: ${BIG_LICENSE_CLOCK_CHECK:true}