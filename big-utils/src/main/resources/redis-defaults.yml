# ============================================================
# Redis 缓存通用配置
# 由 big-utils 提供，各业务模块可继承或覆盖
# 包含连接配置、连接池、序列化、缓存管理等
# ============================================================

spring:
  data:
    redis:
      # ===== 基础连接配置 =====
      # Redis 服务器地址
      host: ${REDIS_HOST:localhost}
      # Redis 服务器端口
      port: ${REDIS_PORT:6379}
      # Redis 密码（建议生产环境通过环境变量配置）
      password: ${REDIS_PASSWORD:}
      # 数据库索引（0-15）
      database: ${REDIS_DATABASE:0}
      # 连接超时时间
      timeout: 3000ms
      # Lettuce 客户端配置
      lettuce:
        pool:
          # 连接池最大连接数（生产环境建议50）
          max-active: 20
          # 连接池最大阻塞等待时间（优化为3s）
          max-wait: 3000ms
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池中的最小空闲连接
          min-idle: 5
        # 关闭超时时间
        shutdown-timeout: 200ms
      
  # Spring Cache 配置
  cache:
    # 缓存类型
    type: redis
    # 缓存名称（模块可覆盖）
    cache-names: productCache,userCache,configCache,tokenCache
    redis:
      # 缓存过期时间（秒）
      time-to-live: 300000
      # 是否缓存 null 值
      cache-null-values: false
      # key 前缀
      key-prefix: "cache:"
      # 使用前缀
      use-key-prefix: true

# MyBatis-Plus 二级缓存配置（可选）
mybatis-plus:
  configuration:
    # 禁用 MyBatis 二级缓存（使用 Redis 统一管理）
    cache-enabled: false
