# ============================================================
# Druid 数据库连接池通用配置
# 由 big-utils 提供，各业务模块可继承或覆盖
# 针对生产环境优化的最佳实践配置
# ============================================================

spring:
  datasource:
    # Druid 连接池配置
    druid:
      # ===== 基础配置 =====
      # 初始化时建立物理连接的个数（生产环境建议10）
      initial-size: 5
      # 最小连接池数量（生产环境建议10）
      min-idle: 5
      # 最大连接池数量（生产环境建议50-100）
      max-active: 20
      # 获取连接时最大等待时间，单位毫秒（优化为30s）
      max-wait: 30000
      
      # ===== 连接检测配置 =====
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒（优化为30s）
      time-between-eviction-runs-millis: 30000
      # 配置一个连接在池中最小生存的时间，单位是毫秒（5分钟）
      min-evictable-idle-time-millis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒（15分钟）
      max-evictable-idle-time-millis: 900000
      # 用来检测连接是否有效的sql，要求是一个查询语句
      validation-query: SELECT 1
      # 建议配置为true，不影响性能，并且保证安全性。申请连接的时候检测，如果空闲时间大于timeBetweenEvictionRunsMillis，执行validationQuery检测连接是否有效。
      test-while-idle: true
      # 申请连接时执行validationQuery检测连接是否有效，做了这个配置会降低性能。
      test-on-borrow: false
      # 归还连接时执行validationQuery检测连接是否有效，做了这个配置会降低性能。
      test-on-return: false
      
      # ===== 缓存配置 =====
      # 是否缓存preparedStatement，也就是PSCache。PSCache对支持游标的数据库性能提升巨大，比如说oracle。在mysql下建议关闭。
      pool-prepared-statements: false
      # 要启用PSCache，必须配置大于0，当大于0时，poolPreparedStatements自动触发修改为true。
      max-pool-prepared-statement-per-connection-size: -1
      
      # ===== 过滤器配置 =====
      # 配置监控统计拦截的filters，去掉后监控界面sql无法统计
      # stat: 监控统计
      # wall: 防火墙
      # slf4j: 日志
      filters: stat,wall,slf4j
      
      # SQL监控配置
      filter:
        stat:
          enabled: true
          # 慢SQL记录（2秒以上）
          log-slow-sql: true
          slow-sql-millis: 2000
          # SQL合并（相同SQL不同参数的合并统计）
          merge-sql: true
        # SQL防火墙（防止SQL注入）
        wall:
          enabled: true
          config:
            # 允许批量执行
            multi-statement-allow: true
            # 禁止DROP表
            drop-table-allow: false
      
      # ===== WebStatFilter配置 =====
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
        # 开启session统计功能
        session-stat-enable: true
        # session统计的最大个数
        session-stat-max-count: 1000
        
      # ===== StatViewServlet配置 =====
      stat-view-servlet:
        # 监控页默认关闭；确需启用时通过 DRUID_STAT_ENABLED=true 显式打开，并务必修改默认账号
        enabled: ${DRUID_STAT_ENABLED:false}
        url-pattern: /druid/*
        # 登录用户名密码（生产环境请修改）
        login-username: ${DRUID_USERNAME:admin}
        login-password: ${DRUID_PASSWORD:admin123}
        # 允许访问的IP（生产环境请限制）
        allow: ""
        # 禁止访问的IP
        deny: ""
        # 是否允许重置统计
        reset-enable: false
      
      # ===== 监控配置 =====
      # 合并多个DruidDataSource的监控数据
      use-global-data-source-stat: true
      
      # ===== 连接泄漏检测 =====
      # 连接泄漏监测，超过指定时间未归还的连接将被强制回收（单位：秒）
      # 开发环境建议开启，生产环境建议关闭（影响性能）
      remove-abandoned: false
      remove-abandoned-timeout: 1800
      log-abandoned: true
      
      # ===== 数据库类型 =====
      db-type: mysql
      
      # ===== 连接属性配置 =====
      connection-properties: >-
        druid.stat.mergeSql=true;
        druid.stat.slowSqlMillis=2000;
        druid.stat.logSlowSql=true
