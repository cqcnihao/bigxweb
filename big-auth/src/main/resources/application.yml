server:
  port: 8081

spring:
  application:
    name: big-auth
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:cqc_db}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:cqcnihao}
    password: ${DB_PASSWORD:cqcnihao}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        ip: ${NACOS_IP:127.0.0.1}
        prefer-ip-address: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.cqcnihao.bigx.auth.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token 配置
sa-token:
  # Token 名称
  token-name: Authorization
  # Token 有效期（单位：秒）默认30天，-1代表永不过期
  timeout: 2592000
  # Token 临时有效期（指定时间内无操作就视为token过期）单位：秒，默认 2 小时
  active-timeout: 7200
  # 是否允许同一账号并发登录（为 true 时允许一起登录，为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token（为 true 时所有登录共用一个 token，为 false 时每次登录新建一个 token）
  is-share: false
  # Token 风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false
  # 是否从 cookie 中读取 token
  is-read-cookie: false
  # 是否从请求体中读取 token
  is-read-body: false
  # 是否从 header 中读取 token
  is-read-header: true

# 只放行经网关签名转发的请求，密钥必须与 big-gateway 侧一致
gateway:
  validation:
    secret: ${GATEWAY_VALIDATION_SECRET:dev-gateway-secret-do-not-use-in-prod}

big:
  web:
    # CORS 由网关统一处理，下游不能再加，否则 Access-Control-Allow-Origin 重复
    cors-enabled: false

  # 软件许可证（TrueLicense）：默认关闭（开发零感知）；
  # 生产 BIG_LICENSE_ENABLED=true + BIG_LICENSE_STORE_PWD 开启，部署目录需含 ./license/license.lic 与 ./license/publicCerts.store
  license:
    enabled: ${BIG_LICENSE_ENABLED:false}
    subject: ${BIG_LICENSE_SUBJECT:bigx}
    license-path: ${BIG_LICENSE_PATH:./license/license.lic}
    public-certs-path: ${BIG_LICENSE_PUB_STORE:./license/publicCerts.store}
    store-pwd: ${BIG_LICENSE_STORE_PWD:}
    verify-interval-minutes: ${BIG_LICENSE_VERIFY_INTERVAL:30}
    on-fail: ${BIG_LICENSE_ON_FAIL:exit}
    clock-rollback-check: ${BIG_LICENSE_CLOCK_CHECK:true}

  auth:
    security:
      # 连续登录失败次数上限，达到后锁定账号
      max-fail-count: 5
      # 账号锁定时长（分钟）
      lock-minutes: 10
      # 同一 IP 登录失败次数上限（窗口内拒绝该 IP 登录，不锁定具体账号）
      max-ip-fail-count: 20
      # IP 维度失败计数窗口（分钟）
      ip-fail-window-minutes: 10
      # 同一 IP 每分钟验证码请求上限
      max-captcha-per-minute: 30

  encrypt:
    enabled: ${BIG_ENCRYPT_ENABLED:true}
    interceptor-enabled: true
    replay-check: ${BIG_ENCRYPT_REPLAY_CHECK:true}
    # 响应体附带 SM2 签名：客户端可据此验证响应确实来自本服务端、未被中间人替换。
    # 签名依赖 sm2.private-key，缺失会让每个加密响应签名失败并返回 500，启动期已做守卫。
    sign-response: ${SM2_SIGN_RESPONSE:true}
    sm4:
      default-key-id: ${SM4_DEFAULT_KEY_ID:v1}
      # 随机生成的密钥（2026-11-17 轮换，非 dev 默认值）；前端经 /auth/public-key 自动装载；
      # 生产仍建议通过环境变量 SM4_KEY_V1 覆盖，避免密钥进入代码库
      keys:
        v1: ${SM4_KEY_V1:LbbeIg78B/N+648M/bRvew==}
    sm2:
      # 严格语义：加密信封必须携带合法 SM2 签名，缺失或校验失败一律拒绝（CODE_SIGN_INVALID）。
      # 浏览器无法持有服务端私钥，故配套启用客户端密钥体系：客户端本地生成密钥对，
      # 公钥登记到 /crypto/sm2/client-key，请求带 clientKeyId + 本地私钥签名，服务端据此验签。
      verify-signature: ${SM2_VERIFY_SIGN:true}
      client-key-enabled: ${SM2_CLIENT_KEY_ENABLED:true}
      client-key-ttl-seconds: ${SM2_CLIENT_KEY_TTL:86400}
      # dev 兜底密钥对仅限本地开发（与 big-business 共用同一对，前端只需一份公钥验签）；
      # prod profile 检测到空值或该 dev 默认私钥将拒绝启动，生产必须注入 SM2_PUBLIC_KEY / SM2_PRIVATE_KEY
      public-key: '${SM2_PUBLIC_KEY:MFkwEwYHKoZIzj0CAQYIKoEcz1UBgi0DQgAEGKIq1EqAQ5hE7PafJzqO92LiDzEYD9lAQ4JA0wgZ+jvsPa+jUNug7JP9InPkN7aOSDKy4F1wxglmm3k/ehoRyw==}'
      private-key: '${SM2_PRIVATE_KEY:MIGTAgEAMBMGByqGSM49AgEGCCqBHM9VAYItBHkwdwIBAQQglEQ0TosYMTeLirfDIfeTwgehdBrAchz/jebTeFYpI9KgCgYIKoEcz1UBgi2hRANCAAQYoirUSoBDmETs9p8nOo73YuIPMRgP2UBDgkDTCBn6O+w9r6NQ26Dsk/0ic+Q3to5IMrLgXXDGCWabeT96GhHL}'
    sm3:
      mac-key: ${SM3_MAC_KEY:}

# AJ-Captcha 行为验证码（滑动拼图）：登录流程二次校验用，装配见 AjCaptchaConfig
# 底图取自 captcha core jar 内置 classpath:defaultImages/jigsaw；缓存走 Redis（SPI 注册），凭证 180 秒一次性消费
aj:
  captcha:
    water-mark: ${AJ_CAPTCHA_WATER_MARK:bigxweb 研发团队}
    water-font: ${AJ_CAPTCHA_WATER_FONT:SimHei}
    slip-offset: ${AJ_CAPTCHA_SLIP_OFFSET:5}
    aes-status: ${AJ_CAPTCHA_AES:true}
    interference-options: ${AJ_CAPTCHA_INTERFERENCE:0}
    jigsaw: classpath:defaultImages/jigsaw
    # 内置分钟级限流：get 30 次/分钟，check 失败 5 次锁 5 分钟
    req-frequency-limit-enable: ${AJ_CAPTCHA_RATE_LIMIT:true}
    req-get-minute-limit: ${AJ_CAPTCHA_GET_LIMIT:30}
    req-check-minute-limit: ${AJ_CAPTCHA_CHECK_LIMIT:60}
    req-verify-minute-limit: ${AJ_CAPTCHA_VERIFY_LIMIT:60}
    req-get-lock-limit: ${AJ_CAPTCHA_LOCK_LIMIT:5}
    req-get-lock-seconds: ${AJ_CAPTCHA_LOCK_SECONDS:300}

logging:
  file:
    path: ./logs/big-auth
  level:
    com.cqcnihao.bigx.auth: DEBUG
    com.baomidou.mybatisplus: INFO

# 私钥等敏感配置禁止入库，统一通过环境变量注入（如 CRYPTO_RSA_PRIVATE_KEY）。
# 如需启用 RSA 配置，请在外部配置中心或环境变量中提供 crypto.rsa.* 配置项。