server:
  port: 8081

spring:
  application:
    name: big-auth
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:cqc_db}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:cqcnihao}
    password: ${DB_PASSWORD:cqcnihao}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        ip: ${NACOS_IP:192.168.115.164}
        prefer-ip-address: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.cqcnihao.bigx.auth.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token 配置
sa-token:
  # Token 名称
  token-name: Authorization
  # Token 有效期（单位：秒）默认30天，-1代表永不过期
  timeout: 2592000
  # Token 临时有效期（指定时间内无操作就视为token过期）单位：秒
  active-timeout: -1
  # 是否允许同一账号并发登录（为 true 时允许一起登录，为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token（为 true 时所有登录共用一个 token，为 false 时每次登录新建一个 token）
  is-share: false
  # Token 风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false
  # 是否从 cookie 中读取 token
  is-read-cookie: false
  # 是否从请求体中读取 token
  is-read-body: false
  # 是否从 header 中读取 token
  is-read-header: true

# 只放行经网关签名转发的请求，密钥必须与 big-gateway 侧一致
gateway:
  validation:
    secret: ${GATEWAY_VALIDATION_SECRET:dev-gateway-secret-do-not-use-in-prod}

big:
  web:
    # CORS 由网关统一处理，下游不能再加，否则 Access-Control-Allow-Origin 重复
    cors-enabled: false
  auth:
    security:
      # 连续登录失败次数上限，达到后锁定账号
      max-fail-count: 5
      # 账号锁定时长（分钟）
      lock-minutes: 10
      # 同一 IP 登录失败次数上限（窗口内拒绝该 IP 登录，不锁定具体账号）
      max-ip-fail-count: 20
      # IP 维度失败计数窗口（分钟）
      ip-fail-window-minutes: 10
      # 同一 IP 每分钟验证码请求上限
      max-captcha-per-minute: 30
  encrypt:
    enabled: ${BIG_ENCRYPT_ENABLED:true}
    interceptor-enabled: true
    replay-check: ${BIG_ENCRYPT_REPLAY_CHECK:true}
    sm4:
      default-key-id: ${SM4_DEFAULT_KEY_ID:v1}
      keys:
        v1: ${SM4_KEY_V1:ZGV2LXNtNC1kZXYta2V5IQ==}
    sm2:
      public-key: ${SM2_PUBLIC_KEY:}
      private-key: ${SM2_PRIVATE_KEY:}
    sm3:
      mac-key: ${SM3_MAC_KEY:}

logging:
  file:
    path: ./logs/big-auth
  level:
    com.cqcnihao.bigx.auth: DEBUG
    com.baomidou.mybatisplus: INFO

# 私钥等敏感配置禁止入库，统一通过环境变量注入（如 CRYPTO_RSA_PRIVATE_KEY）。
# 如需启用 RSA 配置，请在外部配置中心或环境变量中提供 crypto.rsa.* 配置项。