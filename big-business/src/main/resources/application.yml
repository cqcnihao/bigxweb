server:
  port: 8082

spring:
  application:
    name: big-business
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:big_business}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:cqcnihao}
    password: ${DB_PASSWORD:cqcnihao}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        ip: ${NACOS_IP:127.0.0.1}
        prefer-ip-address: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.cqcnihao.bigx.business.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  # 与 big-auth 保持一致：30 天有效，避免下游 token 提前失效
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  # 与 big-auth 一致：每次登录新建 token，便于单端踢下线
  is-share: false
  token-style: uuid
  is-log: false

# 只放行经网关签名转发的请求，密钥必须与 big-gateway 侧一致
gateway:
  validation:
    secret: ${GATEWAY_VALIDATION_SECRET:dev-gateway-secret-do-not-use-in-prod}

big:
  web:
    # CORS 由网关统一处理，下游不能再加，否则 Access-Control-Allow-Origin 重复
    cors-enabled: false

  # 软件许可证（TrueLicense）：默认关闭（开发零感知）；
  # 生产 BIG_LICENSE_ENABLED=true + BIG_LICENSE_STORE_PWD 开启，部署目录需含 ./license/license.lic 与 ./license/publicCerts.store
  license:
    enabled: ${BIG_LICENSE_ENABLED:true}
    subject: ${BIG_LICENSE_SUBJECT:bigx}
    license-path: ${BIG_LICENSE_PATH:./license/license.lic}
    public-certs-path: ${BIG_LICENSE_PUB_STORE:./license/publicCerts.store}
    private-store-path: ${BIG_LICENSE_PRIVATE_STORE:./license/privateKeys.store}
    store-pwd: ${BIG_LICENSE_STORE_PWD:bigx-store-pwd-2024}
    key-pwd: ${BIG_LICENSE_KEY_PWD:bigx-store-pwd-2024}
    private-alias: ${BIG_LICENSE_PRIVATE_ALIAS:privateKey}
    verify-interval-minutes: ${BIG_LICENSE_VERIFY_INTERVAL:30}
    on-fail: ${BIG_LICENSE_ON_FAIL:exit}
    clock-rollback-check: ${BIG_LICENSE_CLOCK_CHECK:true}

  encrypt:
    # 加密全局化试点第一步：默认开启（ANNOTATION 模式，仅标注 @SmEncrypt 的接口生效）
    enabled: ${BIG_ENCRYPT_ENABLED:true}
    interceptor-enabled: true
    replay-check: ${BIG_ENCRYPT_REPLAY_CHECK:true}
    sm4:
      default-key-id: ${SM4_DEFAULT_KEY_ID:v1}
      # dev 兜底密钥仅限本地开发；prod profile 检测到默认值/空值将拒绝启动，生产必须注入 SM4_KEY_V1（16 字节 Base64）
      keys:
        v1: ${SM4_KEY_V1:ZGV2LXNtNC1kZXYta2V5IQ==}
    # SM2 密钥对用于验签/会话密钥保护（@SmEncrypt(sign=true) 时必需）；生产必须通过环境变量注入
    sm2:
      public-key: ${SM2_PUBLIC_KEY:}
      private-key: ${SM2_PRIVATE_KEY:}
    # 为空时回退为 SM4 密钥派生
    sm3:
      mac-key: ${SM3_MAC_KEY:}

logging:
  level:
    com.cqcnihao.bigx.business: DEBUG
    com.baomidou.mybatisplus: INFO