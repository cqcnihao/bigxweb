# ============================================================
# MyBatis-Plus 通用默认配置
# 由 big-utils 提供，各业务模块通过 spring.config.import 导入
# 模块级配置会覆盖此处默认值
# ============================================================

mybatis-plus:
  # Mapper XML 文件扫描路径（通用默认，模块可覆盖）
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # 禁用二级缓存（推荐由 Redis 统一管理缓存）
    cache-enabled: false
  global-config:
    # 全局数据库配置
    db-config:
      # 主键生成策略：数据库自增
      id-type: auto
      # 表名下划线命名
      table-underline: true
      # 逻辑删除全局配置（实体字段加 @TableLogic 即可生效）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 动态表名配置（可选，按需在各模块中覆盖）
yueyoubang:
  dynamic-table-list:
    - wechat_account_follow_record
    - wechat_coin_record
    - wechat_daily_attendance
    - wechat_article
    - wechat_article_read_record
